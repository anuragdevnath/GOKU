<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Report</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-raised: #1c2029;
    --border: #262a33;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #5b8cff;
    --weekend-bg: #241a12;
    --weekend-border: #6b4a1f;
    --weekend-text: #e0a84f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: flex-end;
    margin-bottom: 28px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); }
  input[type="date"] {
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 8px;
    font-size: 14px;
  }
  .checks { display: flex; gap: 16px; font-size: 13px; color: var(--muted); }
  .checks label { display: flex; align-items: center; gap: 6px; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(1.08); }

  #status { font-size: 13px; color: var(--muted); margin-bottom: 16px; min-height: 18px; }
  #error { color: #ff6b6b; font-size: 13px; margin-bottom: 16px; }

  /* ---- Date accordion ---- */
  details.day {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  details.day.weekend {
    background: var(--weekend-bg);
    border-color: var(--weekend-border);
  }
  details.day > summary {
    list-style: none;
    cursor: pointer;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  details.day > summary::-webkit-details-marker { display: none; }
  .chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.15s ease;
    margin-left: 4px;
  }
  details.day[open] > summary .chevron { transform: rotate(90deg); }

  .day-date { font-weight: 600; font-size: 14.5px; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--weekend-text);
    color: #1a1206;
  }
  .count { color: var(--muted); font-size: 12.5px; margin-left: auto; }

  .day-body { padding: 0 12px 14px; }

  /* ---- Source accordion (Gmail / Slack / Google Chat / GitHub) ---- */
  details.source {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 8px;
    overflow: hidden;
  }
  details.source:first-child { margin-top: 0; }
  details.source > summary {
    list-style: none;
    cursor: pointer;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    user-select: none;
  }
  details.source > summary::-webkit-details-marker { display: none; }
  details.source[open] > summary .chevron { transform: rotate(90deg); }
  .source-count { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: auto; }

  .source-body { padding: 0 12px 12px; }
  .empty { color: var(--muted); font-size: 13px; font-style: italic; }

  .event {
    font-size: 13.5px;
    padding: 6px 0;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  .event:first-child { border-top: none; }
  .event a { color: var(--text); text-decoration: none; }
  .event a:hover { color: var(--accent); }
  .event .repo { color: var(--muted); font-size: 12px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Activity Report</h1>
  <div class="sub">Pick a date range to see your GitHub + Gmail + Slack + Google Chat activity, day by day.</div>

  <div class="controls">
    <div class="field">
      <label for="start">From</label>
      <input type="date" id="start">
    </div>
    <div class="field">
      <label for="end">To</label>
      <input type="date" id="end">
    </div>
    <div class="checks">
      <label><input type="checkbox" id="skipGithub"> Skip GitHub</label>
      <label><input type="checkbox" id="skipGmail"> Skip Gmail</label>
      <label><input type="checkbox" id="skipSlack"> Skip Slack</label>
      <label><input type="checkbox" id="skipChat"> Skip Google Chat</label>
    </div>
    <button id="runBtn">Fetch activity</button>
  </div>

  <div id="status"></div>
  <div id="error"></div>
  <div id="results"></div>
</div>

<script>
const startInput = document.getElementById('start');
const endInput = document.getElementById('end');
const runBtn = document.getElementById('runBtn');
const statusEl = document.getElementById('status');
const errorEl = document.getElementById('error');
const resultsEl = document.getElementById('results');

// Default range: last 7 days
const today = new Date();
const weekAgo = new Date(today);
weekAgo.setDate(today.getDate() - 6);
endInput.value = today.toISOString().slice(0, 10);
startInput.value = weekAgo.toISOString().slice(0, 10);

function fmtDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
}

// Which source each raw event type belongs under
function sourceFor(type) {
  if (type.startsWith('Email')) return 'Gmail';
  if (type.startsWith('Slack')) return 'Slack';
  if (type === 'Google Chat message') return 'Google Chat';
  return 'GitHub'; // Commit, PR opened, Issue opened
}

const SOURCE_ORDER = ['Gmail', 'Slack', 'Google Chat', 'GitHub'];

async function runReport() {
  errorEl.textContent = '';
  resultsEl.innerHTML = '';
  const start = startInput.value;
  const end = endInput.value;
  if (!start || !end) {
    errorEl.textContent = 'Please pick both a start and end date.';
    return;
  }
  if (start > end) {
    errorEl.textContent = 'Start date must be before end date.';
    return;
  }

  runBtn.disabled = true;
  statusEl.textContent = 'Fetching… this can take a little while depending on range size.';

  const params = new URLSearchParams({
    start, end,
    skip_github: document.getElementById('skipGithub').checked,
    skip_gmail: document.getElementById('skipGmail').checked,
    skip_slack: document.getElementById('skipSlack').checked,
    skip_chat: document.getElementById('skipChat').checked,
  });

  try {
    const resp = await fetch('/api/report?' + params.toString());
    const data = await resp.json();
    if (!resp.ok) {
      throw new Error(data.error || 'Request failed');
    }
    renderReport(data.report);
    statusEl.textContent = '';
  } catch (err) {
    errorEl.textContent = 'Error: ' + err.message;
    statusEl.textContent = '';
  } finally {
    runBtn.disabled = false;
  }
}

function renderReport(report) {
  resultsEl.innerHTML = '';
  const days = Object.keys(report).sort();

  for (const day of days) {
    const info = report[day];

    // Group this day's events by source (Gmail / Slack / Google Chat / GitHub)
    const bySource = { Gmail: [], Slack: [], 'Google Chat': [], GitHub: [] };
    for (const e of info.events) {
      bySource[sourceFor(e.type)].push(e);
    }

    const dayDetails = document.createElement('details');
    dayDetails.className = 'day' + (info.is_weekend ? ' weekend' : '');
    dayDetails.name = 'days-accordion'; // makes date banners mutually exclusive (one open at a time)

    const summary = document.createElement('summary');
    summary.innerHTML = `
      <span class="day-date">${fmtDate(day)}</span>
      ${info.is_weekend ? '<span class="badge">Weekend / Week Off</span>' : ''}
      <span class="count">${info.events.length} event${info.events.length === 1 ? '' : 's'}</span>
      <span class="chevron">&#9656;</span>
    `;
    dayDetails.appendChild(summary);

    const dayBody = document.createElement('div');
    dayBody.className = 'day-body';

    for (const source of SOURCE_ORDER) {
      const items = bySource[source];
      const sourceDetails = document.createElement('details');
      sourceDetails.className = 'source';
      // internal 4 banners open/close independently of each other

      const sourceSummary = document.createElement('summary');
      sourceSummary.innerHTML = `
        <span>${source}</span>
        <span class="source-count">${items.length}</span>
        <span class="chevron">&#9656;</span>
      `;
      sourceDetails.appendChild(sourceSummary);

      const sourceBody = document.createElement('div');
      sourceBody.className = 'source-body';

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = info.is_weekend ? 'No activity — as expected for a day off.' : 'Nothing found.';
        sourceBody.appendChild(empty);
      } else {
        for (const item of items) {
          const row = document.createElement('div');
          row.className = 'event';
          const titleHtml = item.url
            ? `<a href="${item.url}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a>`
            : `<span>${escapeHtml(item.title)}</span>`;
          row.innerHTML = `
            ${titleHtml}
            <span class="repo">${escapeHtml(item.repo || '')}</span>
          `;
          sourceBody.appendChild(row);
        }
      }

      sourceDetails.appendChild(sourceBody);
      dayBody.appendChild(sourceDetails);
    }

    dayDetails.appendChild(dayBody);
    resultsEl.appendChild(dayDetails);
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

runBtn.addEventListener('click', runReport);
</script>
</body>
</html>
